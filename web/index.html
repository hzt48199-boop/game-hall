</div>
<script>
(function(){
  var box=document.getElementById('aads-overlay'),fr=document.getElementById('aads-ov-frame'),shown=false;
  function show(r){
    if(!shown){ shown=true; fr.innerHTML="<iframe data-aa='2458126' src='//acceptable.a-ads.com/2458126/?size=Adaptive' style='border:0;padding:0;width:100%;height:100%;overflow:hidden;display:block;margin:auto'></iframe>"; box.style.display='block'; }
    var c=document.getElementById('c').getBoundingClientRect();
    box.style.left=(c.left+r.x)+'px'; box.style.top=(c.top+r.y)+'px'; box.style.width=r.w+'px'; box.style.height=r.h+'px';
  }
  function hide(){ if(shown){ shown=false; box.style.display='none'; fr.innerHTML=''; } }
  setInterval(function(){ var a=window.__app; if(a&&a.scene==='ad'&&a.adSlotRect) show(a.adSlotRect); else hide(); },120);
})();
</script>
